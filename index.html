<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX Proof 시범 운영</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --green:#006241; --accent:#00754A; --house:#1E3932; --uplift:#2b5148; --light:#d4e9e2;
    --gold:#cba258; --gold-lightest:#faf6ee; --gold-line:#ecdcbc; --gold-ink:#8a6a2e;
    --warm:#f2f0eb; --ceramic:#edebe9; --white:#fff; --cool:#f9f9f9; --hair:#e7e7e7; --input:#d6dbde;
    --ink:rgba(0,0,0,.87); --soft:rgba(0,0,0,.58); --on-dark-soft:rgba(255,255,255,.70);
    --red:#c82014;
    --card-shadow:0 0 .5px rgba(0,0,0,.14),0 1px 1px rgba(0,0,0,.24);
    --lift:0 0 6px rgba(0,0,0,.24),0 8px 12px rgba(0,0,0,.14);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--warm);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
    letter-spacing:-.01em;line-height:1.55;word-break:keep-all;font-size:15px}
  a{color:var(--accent)}
  button,input,select,textarea{font:inherit;color:inherit}

  /* layout */
  .side{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--house);color:#fff;display:flex;flex-direction:column;padding:20px 14px;z-index:10;overflow-y:auto}
  .side .brand{font-size:18px;font-weight:700;padding:0 8px}
  .side .brand small{display:block;font-size:12px;font-weight:400;color:var(--on-dark-soft)}
  .side .who{margin:18px 0 10px;padding:0 8px}
  .side .who label{font-size:11px;color:var(--on-dark-soft);letter-spacing:.1em}
  .side select{width:100%;margin-top:4px;background:var(--uplift);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px}
  .side nav a{display:flex;justify-content:space-between;align-items:center;color:var(--on-dark-soft);text-decoration:none;padding:9px 12px;border-radius:8px;margin:2px 0;cursor:pointer}
  .side nav a:hover{color:#fff}
  .side nav a.on{background:var(--uplift);color:#fff;font-weight:600}
  .side nav .sec{font-size:11px;letter-spacing:.12em;color:var(--on-dark-soft);margin:16px 12px 4px;opacity:.8}
  .badge{background:var(--gold);color:var(--house);border-radius:50px;font-size:11px;font-weight:700;padding:1px 8px}
  .side .foot{margin-top:auto;padding:12px 8px 0;font-size:12px;color:var(--on-dark-soft);border-top:1px solid rgba(255,255,255,.12)}
  .side .foot b{color:#fff}
  .main{margin-left:240px;padding:28px 32px 80px;min-height:100vh}
  @media(max-width:860px){
    .side{position:static;width:auto;flex-direction:column}
    .side nav{display:flex;flex-wrap:wrap;gap:4px} .side nav .sec{width:100%;margin:8px 4px 0}
    .main{margin-left:0;padding:20px 16px 80px}
  }

  h1{font-size:26px;font-weight:700;color:var(--green);letter-spacing:-.02em}
  h2{font-size:18px;font-weight:700;margin:24px 0 10px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .head p{color:var(--soft);margin-top:4px}
  .card{background:var(--white);border-radius:12px;box-shadow:var(--card-shadow);padding:18px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:1100px){.split{grid-template-columns:1fr}}
  @media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .muted{color:var(--soft)} .s{font-size:13px} .xs{font-size:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}

  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:50px;padding:7px 16px;font-weight:600;font-size:14px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .2s ease;white-space:nowrap}
  .btn.o{background:transparent;color:var(--accent)}
  .btn.g{background:transparent;color:var(--ink);border-color:var(--input)}
  .btn.d{background:transparent;color:var(--red);border-color:var(--red)}
  .btn.sm{padding:4px 12px;font-size:13px}
  .btn:active{transform:scale(.95)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{border:1px solid var(--input);border-radius:50px;padding:5px 13px;background:#fff;cursor:pointer;font-size:14px;transition:all .2s ease}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pill:active{transform:scale(.95)}

  .fld{border:1px solid var(--input);border-radius:4px;position:relative;margin-top:14px;background:#fff}
  .fld>label{position:absolute;top:-9px;left:10px;background:#fff;padding:0 4px;font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.02em}
  .fld input,.fld select,.fld textarea{width:100%;border:0;padding:11px 12px;background:transparent;outline:none;border-radius:4px}
  .fld textarea{min-height:76px;resize:vertical}
  .fld:focus-within{border-color:var(--accent)}
  .lbl{font-size:12px;font-weight:700;color:var(--soft);margin:14px 0 6px;letter-spacing:.02em}
  .hint{font-size:12px;color:var(--soft);margin-top:6px}

  .chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:50px;padding:2px 9px;white-space:nowrap}
  .chip.ok{background:var(--light);color:var(--green)}
  .chip.mid{background:var(--gold-lightest);color:var(--gold-ink);border:1px solid var(--gold-line)}
  .chip.no{background:var(--ceramic);color:var(--soft)}
  .chip.red{background:#fdecea;color:var(--red)}

  .item{border-top:1px solid var(--hair);padding:14px 0}
  .item:first-child{border-top:0;padding-top:0}
  .item .meta{font-size:12px;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .item .ttl{font-weight:600;margin:4px 0}
  .ev a{font-size:12.5px;margin-right:10px}
  .qa{background:var(--cool);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
  .qa .q{font-weight:600}
  .qa .a{margin-top:6px;padding-top:6px;border-top:1px dashed var(--input)}
  .panel{background:var(--gold-lightest);border:1px solid var(--gold-line);border-radius:12px;padding:14px;margin-top:10px}
  .panel.green{background:#f1f8f5;border-color:var(--light)}

  .kpi .v{font-size:28px;font-weight:700;color:var(--green);line-height:1.2}
  .kpi .l{font-size:12px;color:var(--soft)}
  .kpi .n{font-size:12px;color:var(--accent);font-weight:600}
  .wk{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:8px}
  .wk>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--soft);gap:3px}
  .wk i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
  .wk b{font-size:11px;color:var(--green)}
  .hbar{display:grid;grid-template-columns:80px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
  .hbar .t{height:10px;background:var(--ceramic);border-radius:50px;overflow:hidden}
  .hbar .f{height:100%;background:var(--accent);border-radius:50px}
  .hbar em{font-style:normal;color:var(--soft);text-align:right}
  table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
  .tb th{font-size:12px;color:var(--soft);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--hair);white-space:nowrap}
  .tb td{padding:9px 6px;border-bottom:1px solid var(--hair);vertical-align:top}
  .tbw{overflow-x:auto}
  .mx td{text-align:center;border-radius:6px;padding:7px 4px;font-weight:600;font-size:12px}
  .mx td.n{text-align:left;background:none}
  .mx{border-collapse:separate;border-spacing:4px;width:100%}
  .mx th{font-size:11px;color:var(--soft);font-weight:600;text-align:center;padding:2px;max-width:110px}
  .lead{background:var(--accent);color:#fff} .co{background:var(--light);color:var(--green)} .none{background:var(--ceramic);color:var(--soft)}
  .dots{display:inline-flex;gap:4px;vertical-align:middle}
  .dots i{width:11px;height:11px;border-radius:50%;background:var(--ceramic)} .dots i.f{background:var(--accent)}
  .lvl{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;padding:5px 0}
  .empty{color:var(--soft);text-align:center;padding:28px 12px;font-size:14px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--house);color:#fff;padding:10px 18px;border-radius:50px;box-shadow:var(--lift);font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.on{opacity:1}
  .hero{background:var(--house);color:#fff;border-radius:12px;padding:28px}
  .hero h1{color:#fff}
  .hero p{color:var(--on-dark-soft);margin-top:8px}
  .msgs{max-height:420px;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .msg{font-size:14px;padding:10px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap}
  .msg .who{display:block;font-size:11px;font-weight:700;color:var(--soft);margin-bottom:2px;white-space:normal}
  .msg.user{background:var(--light);margin-left:auto}
  .msg.assistant{background:var(--cool);border:1px solid var(--hair)}
  .msg.paste{background:var(--gold-lightest);border:1px dashed var(--gold-line)}
  .sasu{background:var(--house);color:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--lift);animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sasu .who{font-size:11px;font-weight:700;color:var(--light);letter-spacing:.08em}
  .sasu .qq{font-size:17px;font-weight:600;margin:6px 0 8px}
  .sasu textarea{width:100%;margin-top:10px;min-height:70px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:4px;padding:10px;outline:none}
  details.chatref{margin-top:6px;font-size:13px}
  details.chatref summary{cursor:pointer;color:var(--accent);font-weight:600}
  details.chatref .cm{background:var(--cool);border-radius:8px;padding:6px 10px;margin-top:4px;white-space:pre-wrap}
  details.chatref .cm.user{background:var(--light)}
  .cand{border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
  .miss{color:var(--red);font-weight:600}
  /* DL 제출본 */
  .dl{background:#fff;border-radius:12px;box-shadow:var(--card-shadow);padding:32px;max-width:900px}
  .dlh{border-bottom:2px solid var(--house);padding-bottom:14px}
  .dlk{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
  .dlh h2{font-size:24px;margin:6px 0 4px;color:var(--green)}
  .dlmeta,.dlnote{font-size:12px;color:var(--soft)}
  .dlnote{margin-top:4px}
  .dlstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
  .dlstats div{background:var(--cool);border-radius:8px;padding:10px 12px}
  .dlstats b{display:block;font-size:20px;color:var(--green)} .dlstats span{font-size:12px;color:var(--soft)}
  .dlsum{background:var(--gold-lightest);border-radius:8px;padding:14px 16px;margin-bottom:16px}
  .dlsum h3{font-size:15px;margin-bottom:6px} .dlsum p{font-size:14px}
  .dlc{border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin-top:12px}
  .dlch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
  .dlch .sp{flex:1}
  .dlt{width:100%;border-collapse:collapse;font-size:14px}
  .dlt th{width:72px;text-align:left;vertical-align:top;color:var(--green);font-size:13px;padding:7px 8px 7px 0;border-top:1px solid var(--hair);white-space:nowrap}
  .dlt td{padding:7px 0;border-top:1px solid var(--hair);vertical-align:top}
  .dlq{font-size:12.5px;color:var(--soft);background:var(--cool);border-radius:6px;padding:4px 8px;margin-top:4px}
  .dlpp{margin-top:8px}
  .dlf{margin-top:18px;padding-top:12px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--soft)}
  @media(max-width:760px){.dl{padding:18px}.dlstats{grid-template-columns:1fr 1fr}}
  @media print{
    @page{size:A4;margin:14mm}
    .dl{box-shadow:none;padding:0;max-width:none}
    .dlc{break-inside:avoid}
    .dlsum,.dlstats div,.chip,.dlq{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    a{color:inherit;text-decoration:none}
  }
  pre.sql{background:var(--cool);border:1px solid var(--hair);border-radius:8px;padding:12px;font-size:12px;overflow-x:auto;white-space:pre}
  .sum{background:var(--gold-lightest);border-radius:12px;padding:12px 14px;margin-top:12px}
  @media print{.side,.noprint,.toast{display:none!important} .main{margin:0;padding:0} body{background:#fff} .card{box-shadow:none;border:1px solid var(--hair)}}
</style>
</head>
<body>
<aside class="side noprint" id="side"></aside>
<main class="main" id="main"></main>
<div class="toast" id="toast"></div>
<!-- 배포용 설정(선택): 같은 폴더의 config.js에 공유 DB 주소를 적어두면 모든 멤버가 자동 연결됩니다. 없으면 무시됩니다. -->
<script src="config.js" onerror="void 0"></script>

<script>
/* =========================================================
   AX Proof 시범 운영 웹앱 (단일 파일)
   - 로컬 모드: 이 브라우저의 localStorage에 저장
   - 공유 모드: Supabase 테이블 1개(axproof_records)에 저장, 서버 시간 기록
   ========================================================= */
const LS_KEY='axproof.pilot.v1', ME_KEY='axproof.pilot.me', CFG_KEY='axproof.pilot.cfg';
const COLL={user:'users',project:'projects',card:'cards',question:'questions',verif:'verifs',level:'levels',chat:'chats',note:'notes',summary:'summaries'};
const TYPES=['문제 정의','대안 선택','AI 검증','방향 전환','실행 판단'];
const CHOICES=['채택','일부 수정','기각','AI 미사용'];
const ORIGINS=['작업 중','공유시간','스태프·현직자 피드백'];
const AXES=['문제 구조화','근거 검증','대안 판단','AI 조율','결과 학습'];
const EV_KINDS=['문서 버전','AI 대화','자료·논문','실무자 조언','현장 사진','검증 결과'];
const ROLE_LABEL={member:'멤버',mentor:'멘토',admin:'운영진'};
const QUESTION_BANK={
  '문제 정의':['범위를 이렇게 정한 이유는? 이 범위 때문에 빠지는 대상은 없을까?','성공했다고 판단할 기준은 무엇으로 정했어?'],
  '대안 선택':['버린 대안의 가장 큰 장점은 뭐였어? 그래도 버린 이유는?','시간이 두 배 있었다면 다른 선택을 했을까?'],
  'AI 검증':['AI 결과의 그 문제를 어떻게 알아챘어? 어떤 신호가 있었어?','같은 검증을 다른 부분에도 해봤어? 결과는?'],
  '방향 전환':['어떤 근거가 생각을 바꾸게 했어? 원래 판단의 근거는 뭐였어?','방향을 바꾸면서 잃은 것은 뭐야?'],
  '실행 판단':['결과가 예상과 달랐다면 다음엔 무엇을 바꿀 거야?','이 결정을 되돌려야 하는 신호는 뭐라고 봐?']
};
const COMMON_Q=['조건이 바뀐다면(예: 데이터가 절반이라면) 판단이 달라질까?','이 판단을 팀원에게 30초로 설명한다면?'];

let S=emptyState(), cfg=loadJSON(CFG_KEY,{mode:'local',url:'',key:''}), sb=null;
let view='', ui={open:null, filter:'pending', team:'', profileUser:'', draft:null};
let timers=[];

function emptyState(){return {users:[],projects:[],cards:[],questions:[],verifs:[],levels:[],chats:[],notes:[],summaries:[]}}
// 시크릿 창·저장소 차단 환경에서도 화면이 멈추지 않도록 모든 접근을 감싼다
// 저장소를 못 쓰면 창을 닫기 전까지 메모리에 보관
const _mem={};
const LS={get(k){try{return window.localStorage.getItem(k)}catch(e){return k in _mem?_mem[k]:null}},
  set(k,v){_mem[k]=String(v);try{window.localStorage.setItem(k,v)}catch(e){}},
  del(k){delete _mem[k];try{window.localStorage.removeItem(k)}catch(e){}}};
function loadJSON(k,d){try{const v=LS.get(k);return v?JSON.parse(v):d}catch(e){return d}}
function saveJSON(k,v){try{LS.set(k,JSON.stringify(v))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=iso=>{if(!iso)return '-';const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
const fmtD=iso=>{const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()}`};
const localInput=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const byTime=(a,b)=>new Date(a.createdAt)-new Date(b.createdAt);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- AI (Claude API, 브라우저 직접 호출) ---------- */
// 키는 이 브라우저에만 저장되고 공유 DB로 올라가지 않습니다.
const MODEL='claude-opus-5-5', SDK_URL='https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0/+esm', AIKEY_KEY='axproof.pilot.aikey';
let Anthropic=null, aiClient=null, aiClientKey='';
const aiKey=()=>{try{return LS.get(AIKEY_KEY)||''}catch(e){return ''}};
async function getClient(){
  if(!aiKey()) throw new Error('Claude API 키가 없습니다');
  if(!Anthropic) Anthropic=(await import(SDK_URL)).default;
  if(!aiClient||aiClientKey!==aiKey()){aiClient=new Anthropic({apiKey:aiKey(),dangerouslyAllowBrowser:true});aiClientKey=aiKey()}
  return aiClient;
}
async function askClaude(system,messages,format){
  const client=await getClient();
  const res=await client.beta.messages.create({
    model:MODEL, max_tokens:16000, system, messages,
    output_config:Object.assign({effort:'low'},format?{format}:{}),
    betas:['server-side-fallback-2026-07-01'], fallbacks:'default'
  });
  if(res.stop_reason==='refusal') throw new Error('AI가 이 요청에는 답하지 않았습니다');
  return res.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
}
function aiErr(e){
  if(Anthropic){
    if(e instanceof Anthropic.AuthenticationError) return 'API 키가 올바르지 않습니다';
    if(e instanceof Anthropic.RateLimitError) return '요청이 많습니다. 잠시 후 다시 시도하세요';
    if(e instanceof Anthropic.APIConnectionError) return '네트워크 연결을 확인하세요';
  }
  return e&&e.message||String(e);
}
const chatSystem=p=>`너는 링커스 AX 프로젝트 참여자를 돕는 업무 어시스턴트다. 프로젝트: ${p?p.title:''}${p&&p.desc?' — '+p.desc:''}. 한국어로 간결하게 답한다. 사용자가 스스로 판단할 수 있도록 근거와 가정을 분명히 밝히고, 확실하지 않은 수치나 출처는 추정이라고 표시한다.`;
// AI 사수 = Decision Log 정리 도우미. 판단을 대신 만들지 않고, 남긴 기록 안에서만 정리한다.
const SASU_SYSTEM=`너는 링커스 멤버의 Decision Log 정리를 돕는 'AI 사수'다. 판단은 멤버가 내린 것이고, 너는 그 판단을 대신 만들지 않는다. 멤버가 남긴 대화·카드·근거에 실제로 있는 내용만 쓰고, 없는 사실이나 수치는 지어내지 않는다. 한국어로, 멤버 본인의 1인칭 말투로 짧게 쓴다.`;
const CAND_SCHEMA={type:'object',additionalProperties:false,required:['candidates'],properties:{candidates:{type:'array',items:{type:'object',additionalProperties:false,required:['type','choice','reason','evidence'],properties:{type:{type:'string',enum:TYPES},choice:{type:'string',enum:CHOICES},reason:{type:'string'},evidence:{type:'string'}}}}}};
const CHECK_SCHEMA={type:'object',additionalProperties:false,required:['feedback','reason_suggestion'],properties:{feedback:{type:'array',items:{type:'string'}},reason_suggestion:{type:'string'}}};

const QUESTION_SYSTEM=`너는 주니어의 실무 판단력을 키워주는 회사 '사수'다. 방금 저장된 판단 기록을 보고, 그 사람이 그 자리에서 자기 말로만 답할 수 있는 질문을 딱 하나 만든다.

async function askJSON(prompt,schema){const t=await askClaude(SASU_SYSTEM,[{role:'user',content:prompt}],{type:'json_schema',schema});return JSON.parse(t)}

const guessType=tx=>/(왜|빠졌|빠진|누락|틀렸|틀린|출처|근거|확인해|이상해)/.test(tx)?'AI 검증':/(대신|바꿔|바꾸)/.test(tx)?'방향 전환':'대안 선택';

// ① 대화에서 판단 후보 찾기
async function findCandidates(uidv,pid){
  const ms=chatsSinceLastCard(uidv,pid);
  if(!ms.length) return {list:[],src:'none'};
  if(aiKey()){try{
    const r=await askJSON(`아래는 내가 AI와 작업한 대화다. 여기서 내가 실제로 내린 판단(AI 제안을 받아들이거나 고치거나 버린 순간, 방향을 바꾼 순간)을 최대 3개 찾아 Decision Log 카드 후보로 정리해줘. reason은 내가 한 말에 근거해 한 문장으로, evidence는 근거로 남길 자료 이름(없으면 빈 문자열).\n\n${chatText(ms)}`,CAND_SCHEMA);
    return {list:r.candidates.slice(0,3),src:'claude'};
  }catch(e){toast('AI 사수 연결 실패, 기본 방식으로 찾습니다: '+aiErr(e))}}
  const list=ms.filter(m=>m.role!=='assistant'&&DETECT.test(m.text)).slice(-3).map(m=>({type:guessType(m.text),choice:'일부 수정',reason:m.text.replace(/\s+/g,' ').slice(0,80),evidence:'작업 공간 대화 '+fmt(m.createdAt)}));
  return {list,src:'rule'};
}
// ② 작성 중인 카드 점검
function ruleCheck(d){
  const f=[];
  if((d.reason||'').trim().length<15) f.push('이유가 짧습니다. "무엇 때문에" 그렇게 정했는지 한 구절을 더 넣어보세요.');
  if(!d.evidence.some(e=>e.label.trim()||e.url.trim())) f.push('근거 자료가 없습니다. 확인한 표, 대화, 문서 버전 중 하나를 연결해 보세요.');
  if(d.choice!=='AI 미사용'&&!d.evidence.some(e=>e.kind==='AI 대화')&&!chatsSinceLastCard((me()||{}).id,d.projectId).length) f.push('AI 제안을 처리했다면 그 대화를 작업 공간에 기록하거나 근거로 연결해 두세요.');
  if(!d.prediction) f.push('(선택) AI를 보기 전 내 예측을 적어두면 나중에 판단을 돌아보기 좋습니다.');
  return f;
}
async function checkDraft(d){
  const rules=ruleCheck(d);
  if(!aiKey()) return {feedback:rules,suggest:'',src:'rule'};
  try{
    const r=await askJSON(`내가 작성 중인 Decision Log 카드다. 빠진 점을 2개 이내로 짚고(feedback), 내가 쓴 이유를 내 말투를 살려 더 구체적인 한 문장으로 다듬어줘(reason_suggestion). 카드와 대화에 없는 사실은 넣지 마.\n유형: ${d.type}\n처리: ${d.choice}\n이유: ${d.reason||'(비어 있음)'}\n예측: ${d.prediction||'없음'}\n근거: ${d.evidence.map(e=>e.kind+' '+e.label).join(', ')||'없음'}\n최근 대화:\n${chatText(chatsSinceLastCard((me()||{}).id,d.projectId).slice(-6))}`,CHECK_SCHEMA);
    return {feedback:[...rules.filter(x=>x.startsWith('근거')),...r.feedback].slice(0,3),suggest:r.reason_suggestion,src:'claude'};
  }catch(e){toast('AI 사수 연결 실패: '+aiErr(e));return {feedback:rules,suggest:'',src:'rule'}}
}
// ③ 결과·배운 점 초안
async function draftNote(c){
  const qs=qsOf(c.id).filter(q=>q.answer), v=verifOf(c);
  const ctx=`판단: [${c.type} · ${c.choice}] ${c.reason}\n예측: ${c.prediction||'없음'}\n근거: ${(c.evidence||[]).map(e=>e.kind+' '+e.label).join(', ')||'없음'}\n멘토 코멘트: ${v&&v.comment||'없음'}\n받은 질문과 내 답: ${qs.map(q=>q.text+' → '+q.answer).join(' / ')||'없음'}\n연결 대화:\n${chatText((c.chatRefs||[]).map(id=>S.chats.find(m=>m.id===id)).filter(Boolean))}`;
  if(aiKey()){try{
    const r=await askJSON(`아래 판단 기록을 바탕으로 Decision Log의 '결과'(그래서 어떻게 됐나)와 '배운 점'(다음에 무엇을 다르게)을 각각 한두 문장 초안으로 써줘. 기록에 없는 결과는 지어내지 말고, 모르면 "(확인 필요)"라고 써.\n\n${ctx}`,NOTE_SCHEMA);
    return Object.assign(r,{src:'claude'});
  }catch(e){toast('AI 사수 연결 실패: '+aiErr(e))}}
  const done=c.choice==='기각'?'AI 제안을 쓰지 않았다':c.choice==='채택'?'AI 제안을 그대로 반영했다':c.choice==='AI 미사용'?'직접 정했다':'AI 제안을 고쳐 반영했다';
  return {result:((c.evidence||[]).length?`${c.evidence.map(e=>e.label||e.kind).join(', ')}을(를) 근거로 ${done}. `:`${done}. `)+'(결과 확인 필요)',
    lesson:c.choice==='채택'?'다음에는 채택하기 전에 무엇으로 확인했는지 먼저 남기겠다.':'다음에는 AI 결과를 받기 전에 확인할 기준을 먼저 정해두겠다.',src:'rule'};
}

async function draftSummary(uidv,pid){

}
const DETECT=/(왜|빠졌|빠진|누락|틀렸|틀린|아니야|아닌데|대신|바꿔|바꾸|수정|출처|근거|확인해|맞아\?|이상해)/;

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('라이브러리를 불러오지 못했습니다'));document.head.appendChild(s)})}
const store={
  async init(){
    if(cfg.mode==='supabase'&&cfg.url&&cfg.key){
      try{
        if(!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
        sb=window.supabase.createClient(cfg.url,cfg.key); await this.pull(); return;
      }catch(e){ sb=null; cfg.mode='local'; saveJSON(CFG_KEY,cfg); toast('공유 DB 연결 실패, 로컬 모드로 전환: '+e.message); }
    }
    S=Object.assign(emptyState(),loadJSON(LS_KEY,{}));
  },
  async pull(){
    const {data,error}=await sb.from('axproof_records').select('id,kind,data,created_at').order('created_at');
    if(error) throw error;
    const n=emptyState();
    data.forEach(r=>{const c=COLL[r.kind]; if(c) n[c].push(Object.assign({},r.data,{id:r.id,createdAt:r.created_at}))});
    S=n;
  },
  async add(kind,obj){
    obj.id=obj.id||uid();
    if(sb){
      const {data,error}=await sb.from('axproof_records').insert({id:obj.id,kind,data:strip(obj)}).select('created_at');
      if(error) throw error;
      obj.createdAt=data[0].created_at;
    } else obj.createdAt=new Date().toISOString();
    S[COLL[kind]].push(obj); this.persist(); return obj;
  },
  async update(kind,obj){
    if(kind==='card') throw new Error('판단 카드는 수정할 수 없습니다');
    if(sb){const {error}=await sb.from('axproof_records').update({data:strip(obj),updated_at:new Date().toISOString()}).eq('id',obj.id); if(error) throw error;}
    this.persist();
  },
  persist(){ if(!sb) saveJSON(LS_KEY,S); }
};
function strip(o){const r=Object.assign({},o);delete r.id;delete r.createdAt;return r}

function userStats(u){
  const cs=cardsOf(u.id);
  const rt=cs.length?Math.round(cs.filter(isRealtime).length/cs.length*100):0;
  const verified=cs.filter(c=>{const v=verifOf(c);return v&&v.contribution!=='self'}).length;
  const qs=S.questions.filter(q=>cs.some(c=>c.id===q.cardId));
  const pendingQ=qs.filter(q=>!q.answer).length;
  const last=cs.length?cs[cs.length-1].createdAt:null;
  let status=['순조','ok'];
  if(cs.length<2) status=['참여 저조','red'];
  else if(pendingQ>0) status=['답변 대기','mid'];
  else if(rt<50) status=['사후 입력 많음','mid'];
  return {cs,rt,verified,qs,pendingQ,last,status};
}

function qaHTML(q){

          <tr><th>배운 점</th><td>${n&&n.lesson?esc(n.lesson):miss}${n?`<div class="dlnote">${fmt(n.createdAt)} 추가${n.aiAssisted?' · AI 사수 초안 기반':''}</div>`:''}${qs.map(q=>`<div class="dlq"><b>${esc(mentorName(q).name)}</b> Q. ${esc(q.text)}<br>→ ${esc(q.answer)} <span class="dlnote">(응답 ${q.responseSec}초)</span></div>`).join('')}</td></tr>

function vReview(u){
  const f=ui.filter;
  let cs=S.cards.slice().sort(byTime).reverse();
  const hasOpenQ=c=>qsOf(c.id).some(q=>!q.answer);
  if(f==='pending') cs=cs.filter(c=>!verifOf(c)&&!hasOpenQ(c));
  if(f==='asked') cs=cs.filter(hasOpenQ);
  if(f==='done') cs=cs.filter(c=>verifOf(c));
  if(ui.team) cs=cs.filter(c=>{const a=userById(c.userId);return a&&a.team===ui.team});
  const cnt=k=>({pending:S.cards.filter(c=>!verifOf(c)&&!hasOpenQ(c)).length,asked:S.cards.filter(hasOpenQ).length,done:S.cards.filter(c=>verifOf(c)).length,all:S.cards.length})[k];
  return head('검토 대기','멤버의 판단을 근거와 함께 보고, 질문을 보내거나 기여를 확인하세요.')+`
  <div class="row" style="margin-bottom:12px">
    <div class="pills" data-filter>${[['pending','검토 대기'],['asked','질문 진행 중'],['done','확인 완료'],['all','전체']].map(([k,l])=>`<button class="pill ${f===k?'on':''}" data-v="${k}">${l} ${cnt(k)}</button>`).join('')}</div>
    <span class="sp"></span>${teamSelect()}
  </div>
  <div class="card">${cs.length?cs.map(c=>cardItem(c,{actions:reviewActions(c,u)})).join(''):'<div class="empty">해당하는 판단이 없습니다.</div>'}</div>`;
}
function teamSelect(){return `<select class="pill" data-team style="padding:6px 12px"><option value="">모든 팀</option>${teams().map(t=>`<option ${ui.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`}

      <div class="fld"><label>결과</label><select id="vRe"><option value="reviewed">검토</option><option value="measured">실측</option><option value="none">미확인</option></select></div></div>

      <div class="fld"><label>코멘트 (선택)</label><input id="vCm" placeholder="예: 검증 시트 원본 확인, 표본 기준 명확"></div>

      <div class="hint">근거 검증 예: 1 확인 없이 채택 · 2 일부 확인 · 3 독립 자료로 검증 후 수정 · 4 검증 절차를 먼저 설계</div>

function vQuestions(u){
  const qs=S.questions.slice().sort(byTime).reverse();
  const mineOnly=u.role==='mentor';
  const list=mineOnly?qs.filter(q=>q.mentorId===u.id):qs;
  const ans=list.filter(q=>q.answer);
  const avg=ans.length?Math.round(ans.reduce((s,q)=>s+q.responseSec,0)/ans.length):0;
  return head(mineOnly?'내가 보낸 질문':'전체 질문',`응답률 ${list.length?Math.round(ans.length/list.length*100):0}% · 평균 응답 ${avg}초`)+
  `<div class="card">${list.length?list.map(q=>{const c=S.cards.find(x=>x.id===q.cardId),a=c&&userById(c.userId);
    return `<div class="item"><div class="meta"><b style="color:var(--ink)">${esc(a?a.name:'')}</b><span>[${esc(c?c.type:'')}] ${esc(c?c.reason:'')}</span></div>${qaHTML(q)}
    ${q.answer&&!q.ack?`<button class="btn g sm" style="margin-top:6px" data-ack="${q.id}">답변 확인 표시</button>`:''}</div>`}).join(''):'<div class="empty">보낸 질문이 없습니다.</div>'}</div>`;
}

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function vDash(u){
  const ms=members().filter(m=>!ui.team||m.team===ui.team);
  const ids=ms.map(m=>m.id);
  const cs=S.cards.filter(c=>ids.includes(c.userId));
  const rt=cs.length?Math.round(cs.filter(isRealtime).length/cs.length*100):0;
  const ver=cs.filter(c=>{const v=verifOf(c);return v&&v.contribution!=='self'}).length;
  const qs=S.questions.filter(q=>cs.some(c=>c.id===q.cardId)), ans=qs.filter(q=>q.answer);
  const avg=ans.length?Math.round(ans.reduce((s,q)=>s+q.responseSec,0)/ans.length):0;
  // weekly
  const now=weekStart(new Date()); const weeks=[];
  for(let i=5;i>=0;i--){const s=new Date(now);s.setDate(s.getDate()-7*i);weeks.push(s)}
  const wk=weeks.map(s=>{const e=new Date(s);e.setDate(e.getDate()+7);const w=cs.filter(c=>{const t=new Date(c.createdAt);return t>=s&&t<e});return {s,n:w.length,rt:w.length?Math.round(w.filter(isRealtime).length/w.length*100):null}});
  const maxN=Math.max(1,...wk.map(w=>w.n));
  const tc=TYPES.map(t=>[t,cs.filter(c=>c.type===t).length]); const maxT=Math.max(1,...tc.map(x=>x[1]));
  // matrix
  const mt=ui.team||teams()[0]||'';
  const tm=members().filter(m=>m.team===mt);
  const tcards=S.cards.filter(c=>tm.some(m=>m.id===c.userId)&&verifOf(c)).sort(byTime).slice(-8);
  return head('운영 대시보드','기수 전체의 기록, 검증, 질문 현황입니다. 모든 숫자는 입력된 데이터로 실시간 계산됩니다.')+`
  <div class="row" style="margin-bottom:12px">${teamSelect()}<span class="sp"></span><button class="btn o sm noprint" onclick="print()">인쇄·PDF</button></div>
  <div class="grid g4">
    <div class="card kpi"><div class="l">참여 멤버</div><div class="v">${ms.length}명</div><div class="n">${teams().length}개 팀</div></div>
    <div class="card kpi"><div class="l">실시간 기록률</div><div class="v">${rt}%</div><div class="n">판단 후 30분 안에 기록</div></div>
    <div class="card kpi"><div class="l">멘토 확인 판단</div><div class="v">${ver}건</div><div class="n">전체 ${cs.length}건 중</div></div>
    <div class="card kpi"><div class="l">질문 응답</div><div class="v">${ans.length}/${qs.length}</div><div class="n">평균 응답 ${avg}초</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><b>주차별 판단 기록</b> <span class="xs muted">막대 위 숫자는 실시간 기록률</span>
      <div class="wk">${wk.map(w=>`<div><b>${w.rt===null?'':w.rt+'%'}</b><i style="height:${Math.round(w.n/maxN*100)}%"></i>${fmtD(w.s)}주 · ${w.n}</div>`).join('')}</div></div>
    <div class="card"><b>판단 유형 분포</b> <span class="xs muted">${cs.length}건</span>
      ${tc.map(([t,n])=>`<div class="hbar"><span>${t}</span><div class="t"><div class="f" style="width:${Math.round(n/maxT*100)}%"></div></div><em>${n}</em></div>`).join('')}</div>

const SQL=`create table if not exists axproof_records (
  id text primary key,
  kind text not null,
  data jsonb not null,
  created_at timestamptz not null default now(),  -- 서버 시간
  updated_at timestamptz
);
alter table axproof_records enable row level security;
create policy "read all"   on axproof_records for select using (true);
create policy "insert all" on axproof_records for insert with check (true);
-- 판단 카드(kind='card')는 수정 불가: 원본 잠금
create policy "update non-card" on axproof_records for update
  using (kind <> 'card') with check (kind <> 'card');
-- created_at을 클라이언트가 바꾸지 못하게 고정
create or replace function axproof_keep_created() returns trigger as $$
begin new.created_at := old.created_at; return new; end $$ language plpgsql;
drop trigger if exists axproof_keep_created on axproof_records;
create trigger axproof_keep_created before update on axproof_records
  for each row execute function axproof_keep_created();`;

function head(t,p){return `<div class="head"><div><h1>${t}</h1>${p?`<p>${p}</p>`:''}</div></div>`}

/* ---------- render ---------- */
function render(){
  timers.forEach(clearInterval); timers=[];
  const u=me();
  if(u&&!NAV[u.role].some(([k])=>k===view)) view=NAV[u.role][0][0];
  renderSide();
  const m=document.getElementById('main');
  if(!S.users.length||!u){ m.innerHTML=S.users.length?'<div class="card empty">왼쪽에서 사용자를 선택하세요.</div>':vOnboard(); return; }
  const V={work:vWork,inbox:vInbox,mine:vMine,dl:vDL,profile:vProfile,review:vReview,questions:vQuestions,dash:vDash,people:vPeople,data:vData};
  m.innerHTML=V[view](u);
  document.querySelectorAll('[data-since]').forEach(el=>{
    const t0=new Date(el.dataset.since).getTime();
    const f=()=>el.textContent=Math.max(0,Math.round((Date.now()-t0)/1000))+'초'; f(); timers.push(setInterval(f,1000));
  });
}

/* ---------- events ---------- */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='meSel'){LS.set(ME_KEY,t.value);ui.draft=null;ui.helper=null;ui.sasu=null;ui.noteOpen=null;ui.sumDraft=null;ui.chatDraft='';view='';render();return}
  if(t.dataset.dlproj!==undefined){ui.dlProj=t.value;render();return}
  if(t.dataset.mineproj!==undefined){ui.mineProj=t.value;ui.sumDraft=null;render();return}
  if(t.dataset.team!==undefined){ui.team=t.value;render();return}
  if(t.dataset.profsel!==undefined){ui.profileUser=t.value;render();return}
  if(t.dataset.import!==undefined&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S=Object.assign(emptyState(),d);store.persist();toast('불러왔습니다');render()}catch(err){toast('JSON 형식이 올바르지 않습니다')}};r.readAsText(t.files[0]);return}
  if(t.dataset.d&&ui.draft){ui.draft[t.dataset.d]=t.value}
  if(t.dataset.ev!==undefined&&ui.draft){ui.draft.evidence[+t.dataset.ev][t.dataset.k]=t.value}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='chatIn'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){const b=document.querySelector('[data-chatsend]');if(b&&!b.disabled)b.click()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='chatIn') ui.chatDraft=t.value;
  if(t.dataset.d&&ui.draft) ui.draft[t.dataset.d]=t.value;
  if(t.dataset.ev!==undefined&&ui.draft) ui.draft.evidence[+t.dataset.ev][t.dataset.k]=t.value;
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-pick] .pill,[data-filter] .pill,[data-evadd],[data-evdel],[data-savecard],[data-correct],[data-cancelcorr],[data-openq],[data-answer],[data-open],[data-close],[data-sug],[data-sendq],[data-verify],[data-savelevel],[data-ack],[data-prof],[data-addperson],[data-addproj],[data-export],[data-csv],[data-demo],[data-reset],[data-start],[data-connect],[data-local],[data-copysql],[data-sync],[data-chatsend],[data-chatpaste],[data-detect],[data-aisave],[data-aiclear],[data-aicand],[data-candfill],[data-aicheck],[data-applyreason],[data-noteopen],[data-notedraft],[data-notesave],[data-aisum],[data-sumsave],[data-dlprint],[data-sasuclose]');
  if(!t) return;
  const d=t.dataset, u=me();
  if(d.go){go(d.go);return}
  const pick=t.parentElement&&t.parentElement.dataset.pick;
  if(pick){ui.draft[pick]=d.v;t.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p===t));return}
  if(t.parentElement&&t.parentElement.dataset.filter!==undefined){ui.filter=d.v;ui.open=null;render();return}
  if(d.evadd!==undefined){ui.draft.evidence.push({kind:'자료·논문',label:'',url:''});render();return}
  if(d.evdel!==undefined){ui.draft.evidence.splice(+d.evdel,1);render();return}
  if(d.cancelcorr!==undefined){ui.draft.correctsId=null;render();return}
  if(d.correct){const c=S.cards.find(x=>x.id===d.correct);ui.draft={projectId:c.projectId,type:c.type,choice:c.choice,reason:c.reason,prediction:c.prediction||'',occurred:localInput(new Date()),evidence:(c.evidence||[]).map(x=>Object.assign({},x)),correctsId:c.id,origin:c.origin||'작업 중'};go('work');return}
  if(d.savecard!==undefined){
    const r=ui.draft;
    if(!r.reason.trim()){toast('한 줄 이유를 적어주세요');return}
    // 직전 카드 이후 이 프로젝트에서 나눈 AI 대화를 자동 연결
    const prev=S.cards.filter(c=>c.userId===u.id&&c.projectId===r.projectId).sort(byTime).pop();
    const chatRefs=S.chats.filter(m=>m.userId===u.id&&m.projectId===r.projectId&&(!prev||new Date(m.createdAt)>new Date(prev.createdAt))).sort(byTime).slice(-6).map(m=>m.id);
    const card={userId:u.id,projectId:r.projectId,type:r.type,choice:r.choice,reason:r.reason.trim(),prediction:r.prediction.trim(),
      evidence:r.evidence.filter(x=>x.label.trim()||x.url.trim()),occurredAt:new Date(r.occurred).toISOString(),correctsId:r.correctsId||null,chatRefs,origin:r.origin||'작업 중'};
    act(async()=>{
      const c=await store.add('card',card);ui.draft=null;ui.helper=null;ui.sasu={loading:true};render();toast('저장했습니다. 원본은 잠겼습니다.');
      let text='',source='template';
      if(aiKey()){try{text=await askClaude(QUESTION_SYSTEM,[{role:'user',content:questionPrompt(c)}]);source='claude'}catch(err){toast('AI 사수 연결 실패, 기본 질문으로 대체: '+aiErr(err))}}
      if(!text) text=pickQuestion(c.type);
      text=text.split('\n')[0].replace(/^["'“‘\s]+|["'”’\s]+$/g,'');
      const q=await store.add('question',{cardId:c.id,mentorId:'ai',source,text,openedAt:new Date().toISOString()});
